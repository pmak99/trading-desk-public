[project]
name = "ivcrush"
version = "2.5.0"
description = "IV Crush Trading System - Quantitative Earnings Options Strategy Scanner"
requires-python = ">=3.11"
authors = [
    {name = "Trading Desk"}
]
readme = "README.md"
keywords = ["options", "trading", "iv-crush", "volatility", "earnings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "requests>=2.32.5",
    "python-dotenv>=1.2.1",
    "numpy>=2.4.0",
    "tqdm>=4.67.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.0",
    "pytest-asyncio>=0.24.0",
    "black>=26.3.1",
    "ruff>=0.16.7",   # exact pins live in requirements.txt
    "mypy>=2.3.1",
]

[project.scripts]
ivcrush = "src.cli.main:main"

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
# No --cov here: forcing coverage on every run made --no-cov mandatory and slowed
# every suite. Coverage is opt-in: `pytest tests/ --cov --cov-report=term-missing`
# (source and report settings are [tool.coverage.*] below).
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--timeout=300",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "performance: Performance/load tests",
    "slow: Slow running tests",
    "asyncio: Async tests using pytest-asyncio",
    "pg: Requires a reachable Postgres (skipped when unavailable)",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.mypy]
# CI gate (.github/workflows/pr-tests.yml runs `mypy` from 2.0/): these files
# type-check clean. The whole engine package since 2026-09-14 (src/domain and
# src/application/metrics before). Widen `files` as more of the tree is made
# clean -- scripts/, common/ -- never narrow it to get a red build green.
files = ["src"]
python_version = "3.12"  # numpy's stubs need 3.12 syntax; CI and the server run 3.12
strict_optional = true
# 2.0 first, so `src` and `scripts` resolve here; the repo root for `common`.
mypy_path = ["$MYPY_CONFIG_FILE_DIR", "$MYPY_CONFIG_FILE_DIR/.."]
# Modules outside `files` are still read for their types, but their own errors
# belong to whoever widens the gate to them.
follow_imports = "silent"

# yfinance ships no type information (no stubs, no py.typed); its import is
# typed Any. Every call goes through src/infrastructure/api/yahoo.py's gate.
[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*"]
ignore_missing_imports = true

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
# Installed editable, so ruff cannot tell them from third-party packages on its own.
known-first-party = ["common", "src", "scripts"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
